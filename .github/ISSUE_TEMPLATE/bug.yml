name: "Bug report"
description: "Report a reproducible defect in the SDK or Observatory."
title: "[bug]: "
labels: ["type/bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: input
    id: nanitics-version
    attributes:
      label: "Nanitics version"
      placeholder: "`pip show nanitics | grep Version` output, e.g. `0.2.0`"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: "Python version"
    validations:
      required: true
  - type: dropdown
    id: llm-provider
    attributes:
      label: "LLM provider"
      options:
        - anthropic
        - openai
        - mistral
        - litellm
        - mock
        - other/not applicable
    validations:
      required: false
  - type: textarea
    id: trace-logs
    attributes:
      label: "Trace / logs"
      placeholder: "Redact secrets. Paste trace event JSON or stack trace if available."
    validations:
      required: false
  - type: checkboxes
    id: pre-submission
    attributes:
      label: "Pre-submission"
      options:
        - label: "I searched existing issues and Discussions before filing."
          required: true
