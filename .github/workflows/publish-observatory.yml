name: Publish @nanitics/observatory

on:
  push:
    tags:
      - "observatory-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all build/test steps without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-observatory-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observatory
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: observatory/package-lock.json

      - name: Verify npm version supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"
          MAJOR="${NPM_VERSION%%.*}"
          if [ "$MAJOR" -lt 11 ]; then
            echo "::error::npm $NPM_VERSION is too old; trusted publishing needs >=11.5.1"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/observatory-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#observatory-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --provenance --access public

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/observatory-v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
