name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys are atomic — cancelling mid-deploy can leave the Pages site in an
# incomplete state. Keep concurrency scoped per-ref but never cancel in flight.
# PR builds use a distinct group so concurrent PR + main runs don't block each other.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (all extras)
        run: uv sync --all-extras

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Build docs
        run: uv run just docs

      # Pages-specific steps only run on push/dispatch — on a PR there is no
      # Pages site to configure and no artifact to upload (the deploy job
      # doesn't run either, per the same event guard below). Without this
      # gate, actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6 404s when Pages is not enabled.
      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only push-to-main (and manual dispatch) should publish to Pages.
    # PR runs build docs as a gate but must not deploy — Pages has a single
    # live site, and PRs without this guard would either spam deploys or
    # fail for lack of environment access.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
