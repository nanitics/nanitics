name: Release

# Three entry points, one pipeline:
#   * push to main — when the `version` in pyproject.toml changes (no tag for
#     it yet), the repo auto-builds, trusted-publishes to PyPI, then creates the
#     matching `vX.Y.Z` tag and GitHub release with notes from CHANGELOG.md.
#     Bump the version + write the CHANGELOG in the PR; merging it ships.
#   * release: published — manual fallback; cut a release by hand and it
#     publishes.
#   * workflow_dispatch — manual build/publish to testpypi or pypi.
#
# The tag + release are created here (after a successful publish) rather than in
# a separate workflow on purpose: a ref created by the built-in GITHUB_TOKEN does
# not trigger other workflows, so splitting them would require a stored PAT and
# defeat trusted publishing's no-secrets model. Keep the file name `release.yml`
# and the environment `pypi` unchanged — the PyPI trusted-publisher config is
# pinned to both.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publishing target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  check:
    name: Check for release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "(.+)"$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            # release / workflow_dispatch carry explicit release intent.
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${{ steps.version.outputs.version }} detected — releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: observatory/package-lock.json

      - name: Build embedded Observatory SPA
        # Populates nanitics/observatory/ui_assets/ so the wheel ships
        # the UI bundle. The directory is .gitignored; hatchling pulls
        # it in via `artifacts` in pyproject.toml.
        working-directory: observatory
        run: |
          npm ci
          npx vite build --config vite.embed.config.ts

      - name: Build wheel and sdist
        run: uv build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish distribution
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish (trusted publishing + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          repository-url: ${{ (github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  tag-and-release:
    name: Tag and create GitHub release
    needs: [check, publish]
    # Only the auto (push) path creates the tag + release; the manual `release`
    # path already has one, and workflow_dispatch is for test publishes.
    if: github.event_name == 'push' && needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: notes
        run: |
          version="${{ needs.check.outputs.version }}"
          # Print the body of the `## [<version>]` section, stopping at the next
          # `## [` header. Falls back to a pointer if the section is missing.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.check.outputs.version }}"
          gh release create "v$version" \
            --target "${{ github.sha }}" \
            --title "v$version" \
            --notes-file release-notes.md
