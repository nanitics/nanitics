# Authoritative label set — source of truth for repo labels.
#
# Applied manually: edit this file via PR, then sync to GitHub with
# `gh label create/edit` (or a one-shot script that iterates this file).
# There is no sync workflow today; drift is prevented by the PR review
# on this file, not by automation.
#
# Rationale + original decisions recorded in
# temp/launch/phases/contributor-community-governance-phase-1-contributor-intake-surface/technical-spec.md §4.

# Meta
- name: good-first-issue
  description: "Scoped work suitable for first-time external contributors."
  color: 7057ff
- name: help-wanted
  description: "Maintainer signal that outside contribution would be welcome here."
  color: 008672

# Type
- name: type/bug
  description: "Reproducible defect in SDK or Observatory behavior."
  color: d73a4a
- name: type/feature
  description: "New capability or change to the public API."
  color: a2eeef
- name: type/docs
  description: "Documentation defect or improvement."
  color: 0075ca
- name: type/chore
  description: "Maintenance, refactor, or build-system work with no user-facing change."
  color: fef2c0
- name: type/security
  description: "Security-relevant work. Use GHPVR for vulnerabilities, not public issues."
  color: b60205

# Area — one per nanitics/ top-level package plus non-code areas
- name: area/core
  description: "nanitics/core: agent loop, prompts, tool protocol."
