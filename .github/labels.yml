- name: area/collaboration
  description: "nanitics/collaboration: HITL, approval gates, revision gates."
  color: 1d76db
- name: area/composition
  description: "nanitics/composition: orchestration, multi-agent coordination, durability."
  color: 1d76db
- name: area/infrastructure
  description: "nanitics/infrastructure: LLM clients, embeddings, MCP, observability."
